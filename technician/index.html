
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123f7a">
 <title>DG Fault</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="https://freelancesteam.github.io/dg-fault-tracker-admin/dg-fault-technician-icon-180.png">
  <link rel="icon" type="image/png" href="https://freelancesteam.github.io/dg-fault-tracker-admin/dg-fault-technician-icon-192.png">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; }
    body { font-family: Arial, sans-serif; background: #edf4ff; }
    iframe { display: block; width: 100%; height: 100vh; height: 100dvh; border: 0; }
    #error { padding: 24px; color: #a11; text-align: center; }
  </style>
</head>
<body>
  <div id="error" hidden></div>
  <iframe id="technicianApp" title="DG Fault Tracker Technician Form"></iframe>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzY8la37LIrnj4T6Uy4lUL5DY21NzpLnaNfbg3TZST7KpaYTesaQ3qFbCqk8QsQSZT0PA/exec";
    
const params = new URLSearchParams(window.location.search);
const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ""));
const urlToken = params.get("token") || hashParams.get("token") || "";

if (urlToken) {
  localStorage.setItem("dg_fault_technician_token", urlToken);
}

const token = urlToken || localStorage.getItem("dg_fault_technician_token") || "";


    if (!token) {
      document.getElementById("technicianApp").hidden = true;
      const error = document.getElementById("error");
      error.hidden = false;
      error.textContent = "Technician token missing. Please open your assigned technician link.";
    } else {
      document.getElementById("technicianApp").src =
        API_URL + "#token=" + encodeURIComponent(token);
    }
  </script>
  <script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./service-worker.js")
        .catch(function (error) {
          console.error("Service worker registration failed:", error);
        });
    });
  }
</script>
  
<div id="installPrompt" style="display:none;position:fixed;bottom:20px;left:16px;right:16px;background:#123f7a;color:white;padding:18px;border-radius:16px;z-index:99999;box-shadow:0 5px 20px #555">
  <b>Install DG Fault App</b>
  <p style="margin:8px 0">Install the app on your home screen for quick access.</p>
  <button id="installAppBtn" style="padding:12px 20px;background:#ffd400;color:#123f7a;border:0;border-radius:8px;font-weight:bold">Install App</button>
  <button id="closeInstallPrompt" style="padding:12px;background:white;color:#123f7a;border:0;border-radius:8px">Later</button>
</div>

<script>
let deferredInstallPrompt;

window.addEventListener("beforeinstallprompt", function(event) {
  event.preventDefault();
  deferredInstallPrompt = event;
  document.getElementById("installPrompt").style.display = "block";
});

document.getElementById("installAppBtn").addEventListener("click", async function() {
  if (!deferredInstallPrompt) {
    alert("Chrome menu se Install app ya Add to Home screen select karein.");
    return;
  }

  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  document.getElementById("installPrompt").style.display = "none";
});

document.getElementById("closeInstallPrompt").addEventListener("click", function() {
  document.getElementById("installPrompt").style.display = "none";
});
</script>
</body>

</html>
