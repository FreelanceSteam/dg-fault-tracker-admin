<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#123f7a"
  >

  <title>DG Fault Tracker Admin</title>

  <link
    rel="apple-touch-icon"
    href="./dg-fault-tracker-admin-icon-180.png"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    body {

      min-height: 100vh;

      display: flex;

      justify-content: center;

      align-items: center;

      background:
        linear-gradient(
          180deg,
          #17468f 0%,
          #123b7c 50%,
          #0d326b 100%
        );

      padding: 24px;

    }


    .welcome-card {

      width: 100%;

      max-width: 650px;

      padding: 42px 28px 34px;

      text-align: center;

      border-radius: 30px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.16),
          rgba(255,255,255,0.08)
        );

      border: 1px solid
        rgba(255,255,255,0.22);

      box-shadow:
        0 25px 60px
        rgba(0,0,0,0.25);

      backdrop-filter: blur(12px);

    }


    .app-logo {

      width: 150px;

      height: 150px;

      object-fit: cover;

      border-radius: 32px;

      background: #ffffff;

      padding: 5px;

      box-shadow:
        0 12px 30px
        rgba(0,0,0,0.28);

      margin-bottom: 24px;

    }


    .app-title {

      margin: 0;

      color: #ffffff;

      font-size: 34px;

      line-height: 1.15;

      font-weight: 800;

      letter-spacing: -0.5px;

    }


    .app-subtitle {

      margin-top: 18px;

      color: #ffffff;

      font-size: 21px;

      font-weight: 500;

      opacity: 0.96;

    }


    .open-button {

      width: 100%;

      max-width: 500px;

      margin-top: 30px;

      padding: 18px 24px;

      border: none;

      border-radius: 18px;

      background:
        linear-gradient(
          135deg,
          #ffd400,
          #ffca00
        );

      color: #12315f;

      font-size: 20px;

      font-weight: 800;

      cursor: pointer;

      box-shadow:
        0 10px 25px
        rgba(0,0,0,0.22);

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;

    }


    .open-button:active {

      transform: scale(0.97);

      box-shadow:
        0 5px 15px
        rgba(0,0,0,0.18);

    }


    .system-name {

      margin-top: 30px;

      color: rgba(255,255,255,0.72);

      font-size: 15px;

      font-weight: 600;

    }


    @media (max-width: 600px) {

      body {
        padding: 16px;
      }

      .welcome-card {

        padding:
          40px 22px 30px;

        border-radius: 26px;

      }

      .app-logo {

        width: 135px;

        height: 135px;

        border-radius: 28px;

      }

      .app-title {

        font-size: 30px;

      }

      .app-subtitle {

        font-size: 19px;

      }

      .open-button {

        font-size: 18px;

        padding: 17px 18px;

      }

    }


  </style>

</head>


<body>


  <div class="welcome-card">


    <img
      class="app-logo"
      src="./dg-fault-tracker-admin-icon-512.png"
      alt="DG Fault Tracker Admin"
    >


    <h1 class="app-title">

      DG Fault Tracker<br>
      Admin

    </h1>


    <div class="app-subtitle">

      Master Admin Dashboard

    </div>


    <button
      class="open-button"
      onclick="openAdminDashboard()"
    >

      Open Admin Dashboard

    </button>


    <div class="system-name">

      DG Fault Management System

    </div>


  </div>


  <script>

    function openAdminDashboard() {

      window.location.href = "./index.html";

    }

  </script>


</body>

</html>
